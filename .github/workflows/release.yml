name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      offline:
        description: "Build offline release (requires WebView2 Standalone)"
        required: false
        type: boolean
        default: false

jobs:
  # ── Windows Tauri Build ──
  windows-build:
    name: Windows Installer Build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@1.77.2
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build Tauri app
        run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle --config src-tauri/tauri.package.conf.json
      - name: Build NSIS installer
        shell: pwsh
        env:
          OFFLINE_RELEASE: ${{ inputs.offline }}
        run: |
          $arguments = @("-SkipAppBuild")
          if ($env:OFFLINE_RELEASE -eq "true") {
            $arguments += "-OfflineRelease"
          }
          & ./scripts/package-windows.ps1 @arguments

      - name: Verify installer hash
        shell: pwsh
        run: |
          $PackageJson = Get-Content -Raw package.json | ConvertFrom-Json
          $Version = $PackageJson.version
          $Installer = "../EduAgentX_${Version}_x64-setup.exe"
          $HashFile = "$Installer.sha256"

          if (-not (Test-Path -LiteralPath $Installer)) {
            throw "Installer not found: $Installer"
          }
          if (-not (Test-Path -LiteralPath $HashFile)) {
            throw "Hash file not found: $HashFile"
          }

          $ExpectedHash = (Get-FileHash -LiteralPath $Installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $StoredLine = Get-Content -LiteralPath $HashFile -First 1
          $StoredHash = $StoredLine.Split(' ')[0].ToLowerInvariant()

          if ($ExpectedHash -ne $StoredHash) {
            throw "SHA-256 mismatch! Expected: $ExpectedHash, Stored: $StoredHash"
          }
          Write-Host "Installer SHA-256 verified: $ExpectedHash"

      - name: Installer smoke test
        shell: pwsh
        run: |
          $PackageJson = Get-Content -Raw package.json | ConvertFrom-Json
          $Version = $PackageJson.version
          $Installer = Resolve-Path "../EduAgentX_${Version}_x64-setup.exe"

          Write-Host "Running silent install..."
          $process = Start-Process -FilePath $Installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Silent install failed with exit code $($process.ExitCode)"
          }

          $AppPath = "$env:LOCALAPPDATA\Programs\EduAgentX\EduAgentX.exe"
          if (-not (Test-Path -LiteralPath $AppPath)) {
            throw "Application not found at expected path: $AppPath"
          }
          Write-Host "Application installed successfully at: $AppPath"

          Write-Host "Running silent uninstall..."
          $Uninstaller = "$env:LOCALAPPDATA\Programs\EduAgentX\Uninstall.exe"
          if (Test-Path -LiteralPath $Uninstaller) {
            $unproc = Start-Process -FilePath $Uninstaller -ArgumentList "/S" -Wait -PassThru
            Write-Host "Uninstall exit code: $($unproc.ExitCode)"
          } else {
            Write-Host "WARNING: Uninstaller not found at $Uninstaller" -ForegroundColor Yellow
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EduAgentX-windows-installer
          path: |
            EduAgentX_*_x64-setup.exe
            EduAgentX_*_x64-setup.exe.sha256

  # ── Create Release ──
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [windows-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EduAgentX-windows-installer
          path: release-assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/EduAgentX_*_x64-setup.exe
            release-assets/EduAgentX_*_x64-setup.exe.sha256
