# ── Demo / Local override: maps HTTP ports directly, no Nginx ──
# Usage:
#   docker compose --env-file .env.docker --profile demo -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# This mode exposes backend and frontend on localhost ports for local development.
# It does NOT require TLS certificates and is NOT suitable for public deployment.
# It overrides production-oriented settings so that the stack works out-of-the-box
# on a local HTTP environment with Mailpit for email testing.

services:
  backend:
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      COOKIE_SECURE: "false"
      PUBLIC_FRONTEND_URL: http://127.0.0.1:8081
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:8081","http://localhost:8081"]'
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"

  frontend:
    ports:
      - "8081:80"

  mailpit:
    ports:
      - "127.0.0.1:8025:8025"
