# ── Production override: enables HTTPS Nginx reverse proxy ──
# Usage:
#   docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Requires TLS certificates in ./nginx/certs/fullchain.pem and ./nginx/certs/privkey.pem
# See nginx/README.md for certificate setup instructions.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  nginx_logs:
