services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduagentx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-eduagentx}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduagentx} -d ${POSTGRES_DB:-eduagentx}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD"
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: eduagentx-mailpit
    profiles:
      - demo
      - development
      - e2e
    expose:
      - "1025"
      - "8025"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: eduagentx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.docker}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.docker}
    expose:
      - "9000"
      - "9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request, json;
          resp = urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3);
          data = json.loads(resp.read());
          assert data.get('status') == 'ready', f'Not ready: {data}'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 5 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  celery-beat:
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.workers.celery_app
      - beat
      - --loglevel=INFO
      - -s
      - /tmp/celerybeat-schedule
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Beat is a scheduler, not a worker. Check that the schedule file exists
      # and was recently modified (within the last 60 seconds).
      test: ["CMD-SHELL", "python -c \"import os, time; st=os.stat('/tmp/celerybeat-schedule'); exit(0 if time.time()-st.st_mtime < 60 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  outbox-publisher:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    command:
      - python
      - -m
      - app.workers.outbox_publisher
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Check that the process can connect to the database and query the outbox table.
      test: ["CMD-SHELL", "python -c \"import urllib.request; resp=urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3); exit(0 if resp.status==200 else 1)\" 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/health >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── E2E test services (opt-in via --profile e2e) ──
  backend-e2e:
    profiles:
      - e2e
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://eduagentx:${POSTGRES_PASSWORD:-eduagentx}@postgres:5432/eduagentx_e2e
      REDIS_URL: redis://:${REDIS_PASSWORD:-eduagentx}@redis:6379/15
      APP_SECRET_KEY: e2e-test-secret-key-at-least-32-chars
      ENABLE_E2E_ROUTES: "true"
      E2E_TOKEN: "e2e-test-token-change-me"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: noreply@eduagentx.local
      SMTP_FROM_NAME: EduAgentX
      PUBLIC_FRONTEND_URL: http://127.0.0.1:5175
      EMAIL_VERIFICATION_TTL_SECONDS: "86400"
      PASSWORD_RESET_TTL_SECONDS: "1800"
      EMAIL_OUTBOX_ENCRYPTION_KEY: e2e-encryption-key-min-32-chars-long-for-test
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: eduagentx-e2e
      MINIO_SECURE: "false"
    depends_on:
      migrate-e2e:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  migrate-e2e:
    profiles:
      - e2e
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://eduagentx:${POSTGRES_PASSWORD:-eduagentx}@postgres:5432/eduagentx_e2e
      REDIS_URL: redis://:${REDIS_PASSWORD:-eduagentx}@redis:6379/15
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  celery-worker-e2e:
    profiles:
      - e2e
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=1
    restart: unless-stopped
    environment:
      APP_ENV: test
      ENABLE_E2E_ROUTES: "true"
      E2E_TOKEN: "e2e-test-token-change-me"
      DATABASE_URL: postgresql+asyncpg://eduagentx:${POSTGRES_PASSWORD:-eduagentx}@postgres:5432/eduagentx_e2e
      REDIS_URL: redis://:${REDIS_PASSWORD:-eduagentx}@redis:6379/15
      APP_SECRET_KEY: e2e-test-secret-key-at-least-32-chars
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: noreply@eduagentx.local
      SMTP_FROM_NAME: EduAgentX
      PUBLIC_FRONTEND_URL: http://127.0.0.1:5175
      EMAIL_VERIFICATION_TTL_SECONDS: "86400"
      PASSWORD_RESET_TTL_SECONDS: "1800"
      EMAIL_OUTBOX_ENCRYPTION_KEY: e2e-encryption-key-min-32-chars-long-for-test
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: eduagentx-e2e
      MINIO_SECURE: "false"
    depends_on:
      migrate-e2e:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 5 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  outbox-publisher-e2e:
    profiles:
      - e2e
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-c"]
    command:
      - |
        import asyncio
        from app.workers.outbox_publisher import publish_pending_outbox
        async def loop():
            while True:
                try:
                    n = await publish_pending_outbox()
                    if n > 0:
                        print(f'Published {n} events')
                except Exception as e:
                    print(f'Publisher error: {e}')
                await asyncio.sleep(2)
        asyncio.run(loop())
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://eduagentx:${POSTGRES_PASSWORD:-eduagentx}@postgres:5432/eduagentx_e2e
      REDIS_URL: redis://:${REDIS_PASSWORD:-eduagentx}@redis:6379/15
      APP_SECRET_KEY: e2e-test-secret-key-at-least-32-chars
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: noreply@eduagentx.local
      SMTP_FROM_NAME: EduAgentX
      EMAIL_OUTBOX_ENCRYPTION_KEY: e2e-encryption-key-min-32-chars-long-for-test
    depends_on:
      migrate-e2e:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import asyncio; asyncio.run(asyncio.sleep(0))' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  miniodata:
