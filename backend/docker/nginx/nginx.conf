worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 50m;

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8000;
    }

    # ── Shared security headers snippet ──
    # Included in every location that should carry security headers.
    # Nginx's add_header inheritance rule: once a child block defines its own
    # add_header, the parent's are no longer inherited.  We work around this by
    # extracting the headers into a shared file and including it explicitly.

    # ── HTTPS (Production) ──
    # Requires TLS certificate files in /etc/nginx/certs/
    # See nginx/README.md for setup instructions.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Health check endpoint — proxies to backend directly
        location /health/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            access_log off;
        }

        # API endpoints — proxy to FastAPI backend
        location /api/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            add_header X-Accel-Buffering no;
            add_header Cache-Control "no-store";
        }

        # Static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache";
        }
    }

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80;
        server_name _;

        # Health check for Docker / load balancer
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
