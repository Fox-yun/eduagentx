[project]
name = "eduagentx-backend"
version = "4.1.0"
description = "EduAgentX Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "aiosmtplib>=3.0.0",
    "cryptography>=42.0.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "imageio-ffmpeg>=0.6.0",
    "minio>=7.2.0",
]

[project.optional-dependencies]
worker = [
    "celery[redis]>=5.3.0",
]
dev = [
    "celery[redis]>=5.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = [
    "E501",   # Line too long
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends)
    "TC002",  # Move third-party import into type-checking block
    "TC001",  # Move first-party import into type-checking block
    "N806",   # Variable in function should be lowercase (test mock names)
    "SIM116", # Use a dictionary instead of consecutive if statements
    "SIM117", # Use a single with statement (nested with is clearer in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["pptx", "pptx.*", "imageio_ffmpeg", "minio"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error::RuntimeWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
  # Third-party deprecations — tracked upstream, no action in our code
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
  "ignore:Setting per-request cookies:DeprecationWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require DB/Redis)",
    "contract: API contract tests",
    "security: Security tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "app/workers/celery_app.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
