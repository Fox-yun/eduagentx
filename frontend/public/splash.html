<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EduAgentX</title>
    <style>
      *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:linear-gradient(145deg,#f8f5ff,#eef8ff);font-family:"Microsoft YaHei",sans-serif;color:#24143c;overflow:hidden}.card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:1px solid rgba(126,20,255,.12);background:radial-gradient(circle at 50% 15%,rgba(134,59,255,.13),transparent 48%)}.logo{width:76px;height:76px;filter:drop-shadow(0 12px 20px rgba(126,20,255,.22))}.name{font-family:Georgia,serif;font-size:25px;font-weight:700;letter-spacing:.3px}.tagline{font-size:12px;color:#746682}.loader{width:180px;height:4px;border-radius:10px;background:#e6dcf6;overflow:hidden;margin-top:8px}.loader:after{content:"";display:block;width:42%;height:100%;background:linear-gradient(90deg,#7e14ff,#47bfff);border-radius:10px;animation:move 1.2s ease-in-out infinite}.version{position:absolute;bottom:20px;font-size:10px;color:#9b90a6}@keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/favicon.svg" alt="EduAgentX" />
      <div class="name">EduAgentX</div>
      <div class="tagline">正在启动多智能体个性化学习平台</div>
      <div class="loader"></div>
      <div class="version">Version 4.1.0 · Windows x64</div>
    </div>
  </body>
</html>
