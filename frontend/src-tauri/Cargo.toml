[package]
name = "eduagentx-desktop"
version = "4.1.0"
description = "EduAgentX multi-agent personalized learning desktop client"
authors = ["EduAgentX Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "eduagentx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "EduAgentX"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
directories = "6"
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "cookies", "stream", "rustls-tls"] }
reqwest_cookie_store = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-notification = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
